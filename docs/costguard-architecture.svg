<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1080" viewBox="0 0 1800 1080" role="img" aria-labelledby="title desc">
<title id="title">AWS CostGuard architecture</title><desc id="desc">Local Flask dashboard synchronously invokes Lambda. Lambda reads EC2, EBS, S3 and CloudWatch data, writes an encrypted JSON report to an S3 results bucket, publishes an SNS message to email subscribers, and returns the scan result. An optional daily EventBridge schedule invokes Lambda.</desc>
<defs>
 <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#f7faff"/><stop offset="1" stop-color="#edf4fb"/></linearGradient><linearGradient id="head" x2="1"><stop stop-color="#14263d"/><stop offset="1" stop-color="#1d4d73"/></linearGradient><linearGradient id="orange" x2="1" y2="1"><stop stop-color="#ffbb57"/><stop offset="1" stop-color="#f28b18"/></linearGradient>
 <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="7" stdDeviation="11" flood-color="#24435f" flood-opacity=".10"/></filter>
 <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#6c8ca9"/></marker><marker id="arrPurple" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#8c6bc5"/></marker><marker id="arrGreen" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#219b73"/></marker>
 <style>
 text{font-family:Inter,'Segoe UI',Arial,sans-serif;fill:#18334d}.title{font-size:37px;font-weight:750;letter-spacing:-.5px;fill:#fff}.sub{font-size:17px;fill:#a9bfd2}.zone{font-size:13px;font-weight:750;letter-spacing:1.35px;fill:#6b849b}.card{fill:#fff;stroke:#dce7f0;stroke-width:1.5;rx:18;filter:url(#shadow)}.ct{font-size:20px;font-weight:720}.cs{font-size:14px;fill:#5d7489}.tiny{font-size:12px;fill:#8194a6}.edge{fill:none;stroke:#6c8ca9;stroke-width:3;marker-end:url(#arr)}.edgeP{fill:none;stroke:#8c6bc5;stroke-width:3;stroke-dasharray:9 7;marker-end:url(#arrPurple)}.edgeG{fill:none;stroke:#219b73;stroke-width:3;marker-end:url(#arrGreen)}.label{font-size:12px;font-weight:700;fill:#45637e}.smallHead{font-size:16px;font-weight:700}
 </style>
</defs>
<rect width="1800" height="1080" fill="url(#bg)"/><rect width="1800" height="150" fill="url(#head)"/><circle cx="1690" cy="42" r="188" fill="#fff" opacity=".035"/><circle cx="1560" cy="170" r="125" fill="#59b5e9" opacity=".07"/>
<text x="72" y="68" class="title">AWS CostGuard</text><text x="72" y="105" class="sub">Single-account cost visibility · scan, report, and notify</text>
<rect x="1395" y="48" width="335" height="44" rx="22" fill="#e1f7ed"/><circle cx="1422" cy="70" r="6" fill="#20a477"/><text x="1440" y="75" font-size="12" font-weight="750" fill="#176f53">READ-ONLY RESOURCE ANALYSIS</text>

<text x="72" y="199" class="zone">ON-DEMAND SCAN</text>
<!-- User -->
<rect x="72" y="230" width="250" height="188" class="card"/><rect x="98" y="257" width="54" height="54" rx="16" fill="#e8f2ff"/><circle cx="125" cy="276" r="8" fill="#2e82d3"/><path d="M109 301c2-14 31-14 33 0" fill="none" stroke="#2e82d3" stroke-width="4.5" stroke-linecap="round"/><text x="171" y="278" class="ct">User</text><text x="171" y="305" class="cs">Opens dashboard</text><rect x="98" y="337" width="198" height="54" rx="12" fill="#f3f7fc"/><text x="115" y="361" class="cs">Browser on local machine</text><text x="115" y="381" class="tiny">Clicks “Scan AWS”</text>
<!-- Flask -->
<rect x="390" y="230" width="310" height="188" class="card"/><rect x="416" y="257" width="54" height="54" rx="16" fill="#e9f5ed"/><path d="M443 267c-10-2-15 5-13 13 1 4 4 6 9 7l-1 7c-1 8 4 13 12 13s12-5 11-13l-1-8c5-3 8-9 6-14-2-6-8-8-13-5-2-7-8-9-13-7" fill="none" stroke="#308b56" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="439" cy="281" r="2" fill="#308b56"/><circle cx="454" cy="281" r="2" fill="#308b56"/><text x="490" y="278" class="ct">Flask dashboard</text><text x="490" y="305" class="cs">Local web app · /api/scan</text><text x="416" y="359" class="cs">Invokes Lambda synchronously</text><text x="416" y="383" class="tiny">Local AWS credentials + function name</text>
<path d="M322 324H382" class="edge"/><text x="325" y="307" class="label">Browser</text>

<!-- account boundary -->
<rect x="758" y="188" width="970" height="690" rx="26" fill="#f9fcff" stroke="#88b9df" stroke-width="2.3" stroke-dasharray="11 8"/><rect x="786" y="168" width="157" height="39" rx="19" fill="#197fbf"/><text x="811" y="194" font-size="14" font-weight="750" fill="#fff">AWS ACCOUNT</text><text x="1490" y="194" class="tiny">Configured region: ap-south-1</text>

<!-- Lambda -->
<rect x="1080" y="326" width="340" height="236" rx="21" fill="#fff" stroke="#f1c58a" stroke-width="2" filter="url(#shadow)"/><rect x="1107" y="352" width="60" height="60" rx="17" fill="url(#orange)"/><path d="M1143 361h-16l-9 19h15l-6 23 22-28h-16z" fill="#fff"/><text x="1188" y="377" class="ct">AWS Lambda</text><text x="1188" y="404" class="cs">CostGuard scanner</text><line x1="1107" y1="430" x2="1393" y2="430" stroke="#edf1f5" stroke-width="2"/><circle cx="1117" cy="458" r="4" fill="#1683cc"/><text x="1132" y="463" class="cs">Reads resource + usage data</text><circle cx="1117" cy="487" r="4" fill="#1683cc"/><text x="1132" y="492" class="cs">Finds waste + estimates savings</text><circle cx="1117" cy="516" r="4" fill="#1683cc"/><text x="1132" y="521" class="cs">Writes report, sends alert, returns result</text>
<path d="M700 266H736V221H1250V316" class="edge"/><rect x="848" y="205" width="118" height="26" rx="13" fill="#edf5fc"/><text x="864" y="223" class="label">InvokeFunction</text>

<!-- resource APIs group -->
<rect x="800" y="238" width="230" height="386" rx="20" fill="#f2f7fc" stroke="#d6e3ee" stroke-width="1.5"/><text x="821" y="270" class="zone">READ-ONLY DATA</text>
<rect x="818" y="290" width="194" height="65" rx="12" fill="#fff" stroke="#e1e9f0"/><rect x="830" y="303" width="38" height="38" rx="11" fill="#fff0df"/><rect x="840" y="313" width="18" height="18" rx="3" fill="none" stroke="#e58319" stroke-width="2.5"/><path d="M836 318h4m18 0h4m-26 9h4m18 0h4" stroke="#e58319" stroke-width="2"/><text x="879" y="316" class="smallHead">EC2</text><text x="879" y="338" class="tiny">Instances + CPU review</text>
<rect x="818" y="365" width="194" height="65" rx="12" fill="#fff" stroke="#e1e9f0"/><rect x="830" y="378" width="38" height="38" rx="11" fill="#e9f7ef"/><rect x="841" y="385" width="16" height="24" rx="3" fill="none" stroke="#298f59" stroke-width="2.5"/><path d="M844 392h10m-10 6h10" stroke="#298f59" stroke-width="2"/><text x="879" y="391" class="smallHead">EBS</text><text x="879" y="413" class="tiny">Volumes + attachment</text>
<rect x="818" y="440" width="194" height="65" rx="12" fill="#fff" stroke="#e1e9f0"/><rect x="830" y="453" width="38" height="38" rx="11" fill="#f1eaff"/><path d="M841 462h16l-2 20h-12z" fill="none" stroke="#8057c9" stroke-width="2.5"/><path d="M844 462v-3h10v3" fill="none" stroke="#8057c9" stroke-width="2"/><text x="879" y="466" class="smallHead">S3</text><text x="879" y="488" class="tiny">Buckets + object age</text>
<rect x="818" y="515" width="194" height="65" rx="12" fill="#fff" stroke="#e1e9f0"/><rect x="830" y="528" width="38" height="38" rx="11" fill="#fceafa"/><path d="M837 553h6l4-14 6 19 4-11h5" fill="none" stroke="#bd3e9a" stroke-width="2.5" stroke-linejoin="round"/><text x="879" y="541" class="smallHead">CloudWatch</text><text x="879" y="563" class="tiny">EC2 CPU metrics</text>
<!-- read calls arrow, lambda to data -->
<path d="M1072 441H1040" class="edge"/><rect x="1013" y="399" width="67" height="26" rx="13" fill="#edf5fc"/><text x="1022" y="417" class="label">Read APIs</text>

<!-- Outputs -->
<rect x="1470" y="250" width="222" height="153" class="card"/><rect x="1492" y="274" width="48" height="48" rx="14" fill="#f1eaff"/><path d="M1504 284h23l-3 25h-17z" fill="none" stroke="#8057c9" stroke-width="2.8"/><path d="M1508 284v-4h14v4m-13 8h12" fill="none" stroke="#8057c9" stroke-width="2"/><text x="1554" y="291" class="smallHead">S3 reports</text><text x="1554" y="316" class="tiny">Dedicated bucket</text><text x="1492" y="354" class="cs">JSON under scans/</text><text x="1492" y="378" class="tiny">PutObject · AES-256</text>
<path d="M1420 367H1460" class="edge"/><rect x="1417" y="330" width="69" height="24" rx="12" fill="#edf5fc"/><text x="1426" y="347" class="label">Save report</text>
<rect x="1470" y="450" width="222" height="153" class="card"/><rect x="1492" y="474" width="48" height="48" rx="14" fill="#fff0e8"/><path d="M1502 485h28v21h-28z" fill="none" stroke="#e87642" stroke-width="2.7"/><path d="m1503 487 13 10 13-10" fill="none" stroke="#e87642" stroke-width="2.7"/><text x="1554" y="491" class="smallHead">Amazon SNS</text><text x="1554" y="516" class="tiny">Configured topic ARN</text><text x="1492" y="554" class="cs">Scan summary message</text><text x="1492" y="578" class="tiny">sns:Publish permission required</text>
<path d="M1420 495H1460" class="edgeG"/><rect x="1418" y="461" width="68" height="24" rx="12" fill="#e7f7f0"/><text x="1428" y="478" class="label" fill="#176e52">Publish</text>
<rect x="1470" y="650" width="222" height="110" class="card"/><rect x="1492" y="675" width="48" height="42" rx="12" fill="#e7f7f0"/><path d="M1502 686h28v19h-28z" fill="none" stroke="#27966d" stroke-width="2.5"/><path d="m1503 688 13 9 13-9" fill="none" stroke="#27966d" stroke-width="2.3"/><text x="1554" y="685" class="smallHead">Email subscriber</text><text x="1554" y="710" class="tiny">Receives scan update</text><text x="1492" y="740" class="tiny">After confirming SNS subscription</text>
<path d="M1581 603V640" class="edgeG"/>

<!-- EventBridge optional -->
<rect x="1080" y="660" width="340" height="150" rx="18" fill="#fff" stroke="#c7b7e9" stroke-width="2" stroke-dasharray="9 7" filter="url(#shadow)"/><rect x="1104" y="681" width="48" height="48" rx="14" fill="#f2edfc"/><circle cx="1128" cy="705" r="15" fill="none" stroke="#825fc1" stroke-width="2.7"/><path d="M1128 695v11l8 5" fill="none" stroke="#825fc1" stroke-width="2.7" stroke-linecap="round"/><text x="1168" y="696" class="smallHead">EventBridge Scheduler</text><rect x="1168" y="708" width="207" height="24" rx="12" fill="#fff3db"/><text x="1182" y="725" font-size="11" font-weight="750" fill="#8a641e">OPTIONAL · AWS SETUP REQUIRED</text><text x="1104" y="759" class="cs">Daily trigger → same Lambda</text><text x="1104" y="784" class="tiny">Payload: source = eventbridge-daily</text>
<path d="M1250 652V575" class="edgeP"/><rect x="1260" y="613" width="99" height="24" rx="12" fill="#f2edfc"/><text x="1272" y="630" class="label" fill="#7255a6">Scheduled run</text>

<!-- status / IAM notes -->
<rect x="72" y="492" width="628" height="165" rx="20" fill="#fff" stroke="#dce7f0" stroke-width="1.5" filter="url(#shadow)"/><text x="98" y="531" class="zone">ACCESS AND DELIVERY</text>
<circle cx="105" cy="565" r="5" fill="#1683cc"/><text x="121" y="570" class="cs">Flask identity can invoke the CostGuard Lambda.</text>
<circle cx="105" cy="597" r="5" fill="#1683cc"/><text x="121" y="602" class="cs">Lambda role reads resources and writes the S3 report.</text>
<circle cx="105" cy="629" r="5" fill="#e8872b"/><text x="121" y="634" class="cs">Grant sns:Publish on the exact topic ARN to send alerts.</text>

<!-- process summary -->
<rect x="72" y="914" width="1656" height="112" rx="22" fill="#fff" stroke="#dce7f0" stroke-width="1.5" filter="url(#shadow)"/><text x="100" y="950" class="zone">AFTER EACH SUCCESSFUL SCAN</text>
<circle cx="112" cy="987" r="16" fill="#167fca"/><text x="107" y="992" font-size="13" font-weight="750" fill="#fff">1</text><text x="140" y="992" font-size="14" font-weight="650">Analyze resources</text><path d="M278 987H331" class="edge"/>
<circle cx="355" cy="987" r="16" fill="#167fca"/><text x="350" y="992" font-size="13" font-weight="750" fill="#fff">2</text><text x="383" y="992" font-size="14" font-weight="650">Save report to S3</text><path d="M528 987H581" class="edge"/>
<circle cx="605" cy="987" r="16" fill="#167fca"/><text x="600" y="992" font-size="13" font-weight="750" fill="#fff">3</text><text x="633" y="992" font-size="14" font-weight="650">Publish SNS message</text><path d="M813 987H866" class="edgeG"/>
<circle cx="890" cy="987" r="16" fill="#219b73"/><text x="885" y="992" font-size="13" font-weight="750" fill="#fff">4</text><text x="918" y="992" font-size="14" font-weight="650">Notify email subscribers</text><path d="M1145 987H1198" class="edge"/>
<circle cx="1222" cy="987" r="16" fill="#167fca"/><text x="1217" y="992" font-size="13" font-weight="750" fill="#fff">5</text><text x="1250" y="992" font-size="14" font-weight="650">Return results to dashboard</text><text x="72" y="1057" class="tiny">Scheduled scans also store a report and send an SNS update. Dashboard currently shows fresh on-demand scans; it does not yet load scheduled reports from S3.</text>
</svg>
